[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "policy-generator"
version = "0.1.0"
description = "Generate tailored, ISO 27001 / SOC 2-aligned information-security policies and SOPs from a short company profile, exported as clean Markdown and Word (.docx)."
authors = [{ name = "Al Amin Bashir Afara", email = "aminafara123@gmail.com" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "python-docx>=1.1,<2",
    "PyYAML>=6,<7",
]

[project.scripts]
policy-generator = "generate:main"

# Single-file module plus its LLM helper; templates ship as data next to them.
[tool.hatch.build.targets.wheel]
include = ["generate.py", "llm.py"]

[tool.hatch.build.targets.wheel.force-include]
"templates" = "templates"
